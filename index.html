<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cycle App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #222;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      font-size: 18px;
    }

    .calendar {
      background: white;
      border-radius: 20px;
      padding: 10px;
      margin: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day {
      height: 56px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      border: 1px solid #f1f1f1;
      background: #ffffff;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    .day:active {
      transform: scale(0.98);
    }

    .day-number {
      font-size: 13px;
      color: #333;
      line-height: 1;
    }

    .cycle-day {
      font-size: 10px;
      color: #a0a0a0;
      line-height: 1;
      margin-top: 3px;
    }

    .cycle-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 5px;
      background: #e9e9e9;
      transition: all 0.2s ease;
    }

    .cycle-dot.normal {
      background: #e9e9e9;
    }

    .cycle-dot.period {
      background: #ff5c8a;
    }

    .cycle-dot.ovulation {
      background: #6c5ce7;
    }

    .cycle-dot.fertile {
      background: #ffd1dc;
    }

    .today {
      border: 2px solid #111;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      margin: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .big {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      color: #000;
    }

    .small {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: #888;
      white-space: pre-line;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #222;
    }

    .save-status {
      margin: 12px 10px 10px;
      font-size: 14px;
      color: #888;
      text-align: center;
      white-space: pre-line;
    }

    .save-btn {
      display: block;
      width: calc(100% - 20px);
      margin: 0 10px 20px;
      padding: 14px 16px;
      border: none;
      border-radius: 16px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }

    .modal-box {
      width: calc(100% - 24px);
      max-width: 420px;
      background: #f7f7f7;
      border-radius: 20px 20px 0 0;
      overflow: hidden;
      margin-bottom: 0;
    }

    .modal-action,
    .modal-cancel {
      width: 100%;
      background: white;
      border: none;
      border-bottom: 1px solid #ececec;
      padding: 18px 16px;
      font-size: 20px;
      color: #007aff;
      cursor: pointer;
    }

    .modal-cancel {
      margin-top: 8px;
      border-bottom: none;
      font-weight: 500;
    }

    #month {
      font-size: 18px;
      font-weight: 600;
    }

    .view-switch {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 10px 10px;
    }

    .view-btn {
      border: none;
      background: #f3f3f3;
      color: #555;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-btn.active {
      background: #111;
      color: white;
    }

    .year-view {
      background: white;
      border-radius: 20px;
      padding: 24px 16px;
      margin: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .year-placeholder {
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      color: #777;
    }

    .hidden {
      display: none;
    }

    .year-view {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 10px;
}

    .year-month {
      background: #fff;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .year-month-title {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 6px;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .year-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #eee;
    }

    .year-dot.period {
      background: #ff5c8a;
    }
  </style>
</head>

<body>
  <div class="header">
    <button class="nav-btn" onclick="prevMonth()">←</button>
    <div id="month"></div>
    <button class="nav-btn" onclick="nextMonth()">→</button>
  </div>

  <div class="view-switch">
    <button id="month-view-btn" class="view-btn active" onclick="setViewMode('month')">Месяц</button>
    <button id="year-view-btn" class="view-btn" onclick="setViewMode('year')">Год</button>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div>
      <div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <div id="year-view" class="year-view hidden">
    <div class="year-placeholder">
      Режим года скоро будет здесь ✨
    </div>
  </div>

  <div class="card">
    <div class="big" id="status">День цикла</div>
    <div class="small" id="info">Информация</div>
  </div>

  <div id="save-status" class="save-status">Локально сохранено</div>
  <button class="save-btn" onclick="sendSave()">Сохранить в бот 🌸</button>

  <div id="day-modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-action" onclick="setCycleStart()">Сделать началом цикла</button>
      <button class="modal-action" onclick="markPeriodDay()">Отметить день менструации</button>
      <button class="modal-action" onclick="removePeriodDay()">Убрать отметку</button>
      <button class="modal-cancel" onclick="closeModal()">Отмена</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    let selectedDays = [];
    const now = new Date();
    let current = new Date(now.getFullYear(), now.getMonth(), 1);
    let modalDate = null;
    let pressTimer = null;
    let viewMode = "month";

    let cycleLength = 28;
    let periodLength = 5;
    let lastStart = new Date("2026-03-13");

    const monthNames = [
      "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
      "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
    ];

    function normalize(date) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function formatISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function setSaveStatus(text) {
      const statusEl = document.getElementById("save-status");
      if (statusEl) statusEl.innerText = text;
    }

    function saveToLocal() {
      const state = {
        selectedDays,
        lastStart: formatISO(lastStart),
        cycleLength,
        periodLength,
        viewMode
      };
      localStorage.setItem("cycleAppState", JSON.stringify(state));
      setSaveStatus("Локально сохранено ✓");
    }

    function loadFromLocal() {
      const raw = localStorage.getItem("cycleAppState");
      if (!raw) return;

      try {
        const state = JSON.parse(raw);
        selectedDays = Array.isArray(state.selectedDays) ? state.selectedDays : [];
        cycleLength = state.cycleLength ?? cycleLength;
        periodLength = state.periodLength ?? periodLength;
        lastStart = state.lastStart ? new Date(state.lastStart) : lastStart;
        viewMode = state.viewMode ?? "month";
      } catch (error) {
        console.error("Ошибка чтения localStorage:", error);
      }
    }

    function openModal(date) {
      modalDate = date;
      document.getElementById("day-modal").classList.remove("hidden");
    }

    function closeModal() {
      modalDate = null;
      document.getElementById("day-modal").classList.add("hidden");
    }

    function setViewMode(mode) {
      viewMode = mode;

      const calendar = document.querySelector(".calendar");
      const yearView = document.getElementById("year-view");
      const monthBtn = document.getElementById("month-view-btn");
      const yearBtn = document.getElementById("year-view-btn");

function setViewMode(mode) {
  viewMode = mode;

  const calendar = document.querySelector(".calendar");
  const yearView = document.getElementById("year-view");
  const monthBtn = document.getElementById("month-view-btn");
  const yearBtn = document.getElementById("year-view-btn");

  if (mode === "month") {
      calendar.classList.remove("hidden");
      yearView.classList.add("hidden");
      monthBtn.classList.add("active");
      yearBtn.classList.remove("active");
     } 
    else {
      calendar.classList.add("hidden");
      yearView.classList.remove("hidden");
      monthBtn.classList.remove("active");
      yearBtn.classList.add("active");

      renderYear(); // 👈 ВАЖНО
      }
    }
    }

    function setCycleStart() {
      if (!modalDate) return;

      lastStart = new Date(modalDate);
      selectedDays = [];

      saveToLocal();
      render();
      showInfo(modalDate);
      closeModal();
    }

    function markPeriodDay() {
      if (!modalDate) return;

      const iso = formatISO(modalDate);
      if (!selectedDays.includes(iso)) {
        selectedDays.push(iso);
      }

      saveToLocal();
      render();
      showInfo(modalDate);
      closeModal();
    }

    function removePeriodDay() {
      if (!modalDate) return;

      const iso = formatISO(modalDate);
      selectedDays = selectedDays.filter(day => day !== iso);

      saveToLocal();
      render();
      showInfo(modalDate);
      closeModal();
    }

    function prevMonth() {
      current = new Date(current.getFullYear(), current.getMonth() - 1, 1);
      render();
    }

    function nextMonth() {
      current = new Date(current.getFullYear(), current.getMonth() + 1, 1);
      render();
    }

    function getNextCycleStart() {
      return new Date(normalize(lastStart).getTime() + cycleLength * 86400000);
    }

    function getOvulation(start) {
      return new Date(normalize(start).getTime() + (cycleLength - 14) * 86400000);
    }

    function isBetween(date, start, end) {
      return normalize(date) >= normalize(start) && normalize(date) <= normalize(end);
    }

    function render() {
      const grid = document.getElementById("grid");
      const month = document.getElementById("month");

      grid.innerHTML = "";

      const year = current.getFullYear();
      const m = current.getMonth();

      month.innerText = `${monthNames[m]} ${year}`;

      const firstDay = new Date(year, m, 1).getDay();
      const offset = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, m + 1, 0).getDate();

      const ovulation = getOvulation(lastStart);
      const fertileStart = new Date(ovulation.getTime() - 4 * 86400000);
      const fertileEnd = new Date(ovulation.getTime() + 1 * 86400000);
      const nextCycle = getNextCycleStart();
      const periodEnd = new Date(normalize(lastStart).getTime() + (periodLength - 1) * 86400000);

      for (let i = 0; i < offset; i++) {
        grid.appendChild(document.createElement("div"));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, m, d);
        const div = document.createElement("div");
        div.classList.add("day");

        const diff = Math.floor(
          (normalize(date) - normalize(lastStart)) / 86400000
        );

        let cycleDay = null;
        if (diff >= 0) {
          cycleDay = (diff % cycleLength) + 1;
        }

        div.innerHTML = `
          <div class="day-number">${d}</div>
          ${cycleDay ? `<div class="cycle-day">${cycleDay}</div>` : `<div class="cycle-day"></div>`}
          <div class="cycle-dot normal"></div>
        `;

        const dot = div.querySelector(".cycle-dot");
        const iso = formatISO(date);

        let baseStatus = "normal";

        if (isBetween(date, lastStart, periodEnd)) {
          baseStatus = "period";
        } else if (normalize(date).getTime() === normalize(ovulation).getTime()) {
          baseStatus = "ovulation";
        } else if (isBetween(date, fertileStart, fertileEnd)) {
          baseStatus = "fertile";
        }

        dot.className = `cycle-dot ${baseStatus}`;
        dot.dataset.baseStatus = baseStatus;

        if (selectedDays.includes(iso)) {
          dot.className = "cycle-dot period";
          dot.dataset.userSelected = "true";
        } else {
          dot.dataset.userSelected = "false";
        }

        if (normalize(date).getTime() === normalize(new Date()).getTime()) {
          div.classList.add("today");
        }

        if (normalize(date).getTime() === normalize(nextCycle).getTime()) {
          div.style.border = "2px dashed #ff5c8a";
        }

        div.addEventListener("click", () => {
          showInfo(date);
        });

        div.addEventListener("touchstart", () => {
          pressTimer = setTimeout(() => {
            openModal(date);
          }, 500);
        });

        div.addEventListener("touchend", () => {
          clearTimeout(pressTimer);
        });

        div.addEventListener("mousedown", () => {
          pressTimer = setTimeout(() => {
            openModal(date);
          }, 500);
        });

        div.addEventListener("mouseup", () => {
          clearTimeout(pressTimer);
        });

        div.addEventListener("mouseleave", () => {
          clearTimeout(pressTimer);
        });

        div.addEventListener("dblclick", () => {
          openModal(date);
        });

        grid.appendChild(div);
      }
    }

    function showInfo(date) {
      const status = document.getElementById("status");
      const info = document.getElementById("info");

      const nextCycle = getNextCycleStart();
      const diffToNext = Math.ceil(
        (normalize(nextCycle) - normalize(date)) / 86400000
      );

      const diff = Math.floor(
        (normalize(date) - normalize(lastStart)) / 86400000
      ) + 1;

      status.innerText = diff > 0 ? `День цикла ${diff}` : "До начала цикла";

      const ovulation = getOvulation(lastStart);
      const fertileStart = new Date(ovulation.getTime() - 4 * 86400000);
      const fertileEnd = new Date(ovulation.getTime() + 1 * 86400000);
      const periodEnd = new Date(normalize(lastStart).getTime() + (periodLength - 1) * 86400000);

      if (diff < 1) {
        info.innerText = "До начала цикла";
      } else if (isBetween(date, lastStart, periodEnd)) {
        info.innerText = `Менструация 🩸\nДо следующего цикла: ${diffToNext} дн.`;
      } else if (normalize(date).getTime() === normalize(ovulation).getTime()) {
        info.innerText = `Овуляция 💜\nДо следующего цикла: ${diffToNext} дн.`;
      } else if (isBetween(date, fertileStart, fertileEnd)) {
        info.innerText = `Фертильное окно 🌸\nДо следующего цикла: ${diffToNext} дн.`;
      } else {
        info.innerText = `Обычный день\nДо следующего цикла: ${diffToNext} дн.`;
      }
    }

    function sendSave() {
      const tg = window.Telegram?.WebApp;

      if (!tg || !tg.sendData) {
        setSaveStatus("Открыто не в Telegram\nили WebApp API недоступен");
        console.error("Telegram WebApp API недоступен");
        return;
      }

      try {
        const payload = {
          type: "save_cycle",
          days: selectedDays,
          last_start: formatISO(lastStart)
        };

        tg.sendData(JSON.stringify(payload));
        setSaveStatus("Отправлено в бот ✓");

        setTimeout(() => {
          tg.close();
        }, 300);
      } catch (error) {
        console.error("Ошибка отправки в бот:", error);
        setSaveStatus("Ошибка отправки");
      }
    }

    const params = new URLSearchParams(window.location.search);
  const data = params.get("data");

  if (data) {
    try {
      const userData = JSON.parse(decodeURIComponent(data));

      cycleLength = userData.cycle_length ?? 28;
      periodLength = userData.period_length ?? 5;
      lastStart = userData.last_start
        ? new Date(userData.last_start)
        : new Date("2026-03-13");

      selectedDays = Array.isArray(userData.marked_days)
        ? userData.marked_days
        : [];

      saveToLocal();
    } catch (error) {
      console.error("Ошибка чтения data из URL:", error);
      loadFromLocal();
    }
  } else {
    loadFromLocal();
  }

    render();
    setViewMode(viewMode);
  
  function renderYear() {
  const yearView = document.getElementById("year-view");
  yearView.innerHTML = "";

  const year = current.getFullYear();

  for (let m = 0; m < 12; m++) {
    const monthBlock = document.createElement("div");
    monthBlock.classList.add("year-month");

    const title = document.createElement("div");
    title.classList.add("year-month-title");
    title.innerText = monthNames[m];

    const grid = document.createElement("div");
    grid.classList.add("year-grid");

    const daysInMonth = new Date(year, m + 1, 0).getDate();

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, m, d);

      const dot = document.createElement("div");
      dot.classList.add("year-dot");

      const diff = Math.floor(
        (normalize(date) - normalize(lastStart)) / 86400000
      );

      if (diff >= 0) {
        const cycleDay = (diff % cycleLength) + 1;

        if (cycleDay <= periodLength) {
          dot.classList.add("period");
        }
      }

      grid.appendChild(dot);
    }

    monthBlock.appendChild(title);
    monthBlock.appendChild(grid);
    yearView.appendChild(monthBlock);
  }
}
  </script>
</body>
</html>
