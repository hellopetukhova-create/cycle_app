<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycle App</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: #ffffff;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px;
    font-size: 18px;
}

.calendar {
    background: white;
    border-radius: 20px;
    padding: 10px;
    margin: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: #999;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 10px;
}

.day {
    height: 50px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
}

.day-number {
    font-size: 12px;
    color: #333;
}

.cycle-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 4px;
    background: transparent; /* по умолчанию прозрачный */
    transition: all 0.3s ease;
}

.cycle-dot.period {
    background: #ff5c8a;
}

.cycle-dot.ovulation {
    background: #3b2b8f;
}

.cycle-dot.fertile {
    background: #ffd1dc;
}

.period {
    background: #ff5c8a;
    color: white;
}

.ovulation {
    background: #3b2b8f;
    color: white;
}

.fertile {
    background: #ffd1dc;
}

.today {
    border: 2px solid black;
}

.card {
    background: white;
    border-radius: 20px;
    padding: 15px;
    margin: 10px;
}

.big {
    font-size: 26px;
    font-weight: bold;
}

.small {
    color: #777;
}

button {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">
    <button onclick="prevMonth()">←</button>
    <div id="month"></div>
    <button onclick="nextMonth()">→</button>
</div>

<div class="calendar">
    <div class="weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div>
        <div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div id="grid" class="grid"></div>
</div>

<div class="card">
    <div class="big" id="status">День цикла</div>
    <div class="small" id="info">Информация</div>
</div>

<button onclick="saveData()">Сохранить 🌸</button>

<script>

// ===== ГЛОБАЛЬНЫЕ =====
let selectedDays = [];
let current = new Date();

let cycleLength = 28;
let periodLength = 5;
let lastStart = new Date("2026-03-13");

// ===== ВАЖНО: НОРМАЛИЗАЦИЯ =====
function normalize(date) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

const monthNames = [
    "Январь","Февраль","Март","Апрель","Май","Июнь",
    "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
];

function prevMonth() {
    current.setMonth(current.getMonth() - 1);
    render();
}

function nextMonth() {
    current.setMonth(current.getMonth() + 1);
    render();
}

function getNextCycleStart() {
    return new Date(normalize(lastStart).getTime() + cycleLength * 86400000);
}

function getOvulation(start) {
    return new Date(normalize(start).getTime() + (cycleLength - 14) * 86400000);
}

function isBetween(date, start, end) {
    return normalize(date) >= normalize(start) && normalize(date) <= normalize(end);
}

// ===== ОСНОВНОЙ РЕНДЕР =====
function render() {
    const grid = document.getElementById("grid");
    const month = document.getElementById("month");

    grid.innerHTML = "";

    const year = current.getFullYear();
    const m = current.getMonth();

    month.innerText = `${monthNames[m]} ${year}`;

    const firstDay = new Date(year, m, 1).getDay();
    const offset = firstDay === 0 ? 6 : firstDay - 1;
    const daysInMonth = new Date(year, m + 1, 0).getDate();

    const ovulation = getOvulation(lastStart);
    const fertileStart = new Date(ovulation.getTime() - 4 * 86400000);
    const fertileEnd = new Date(ovulation.getTime() + 1 * 86400000);
    const nextCycle = getNextCycleStart();

    for (let i = 0; i < offset; i++) {
        grid.appendChild(document.createElement("div"));
    }

for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, m, d);
    const div = document.createElement("div");
    div.classList.add("day");

    const diff = Math.floor(
        (normalize(date) - normalize(lastStart)) / 86400000
    );
    let cycleDay = diff >= 0 ? (diff % cycleLength) + 1 : null;

    // создаём HTML
    div.innerHTML = `
        <div class="day-number">${d}</div>
        <div class="cycle-dot"></div>
    `;

    const dot = div.querySelector(".cycle-dot");

    // окрашиваем кружочек по состоянию
    const periodEnd = new Date(normalize(lastStart).getTime() + periodLength * 86400000);
    const ovulation = getOvulation(lastStart);
    const fertileStart = new Date(ovulation.getTime() - 4 * 86400000);
    const fertileEnd = new Date(ovulation.getTime() + 1 * 86400000);

    if (isBetween(date, lastStart, periodEnd)) dot.classList.add("period");
    else if (date.toDateString() === ovulation.toDateString()) dot.classList.add("ovulation");
    else if (isBetween(date, fertileStart, fertileEnd)) dot.classList.add("fertile");

    div.onclick = () => {
        const iso = date.toISOString().split("T")[0];
        if (selectedDays.includes(iso)) {
            selectedDays = selectedDays.filter(d => d !== iso);
            dot.className = "cycle-dot"; // убираем все состояния
        } else {
            selectedDays.push(iso);
            dot.classList.add("period"); // добавляем красный кружочек
        }
        showInfo(date);
    };

    grid.appendChild(div);
}
}

// ===== ИНФО =====
function showInfo(date) {
    const status = document.getElementById("status");
    const info = document.getElementById("info");

    const nextCycle = getNextCycleStart();
    const diffToNext = Math.ceil((nextCycle - date) / 86400000);

    const diff = Math.floor(
        (normalize(date) - normalize(lastStart)) / 86400000
    ) + 1;

    status.innerText = `День цикла ${diff}`;

    if (diff < 0) {
        info.innerText = "До начала цикла";
    } else if (diff <= periodLength) {
        info.innerText = `Менструация 🩸\nДо следующего цикла: ${diffToNext} дн.`;
    } else if (diff === cycleLength - 14) {
        info.innerText = `Овуляция 💜\nДо следующего цикла: ${diffToNext} дн.`;
    } else {
        info.innerText = `Обычный день\nДо следующего цикла: ${diffToNext} дн.`;
    }
}

// ===== СЕЙВ =====
function saveData() {
    const tg = window.Telegram.WebApp;

    tg.sendData(JSON.stringify({
        type: "save_cycle",
        days: selectedDays
    }));

    tg.close();
}

// ===== ДАННЫЕ ИЗ БОТА =====
const params = new URLSearchParams(window.location.search);
const data = params.get("data");

if (data) {
    const userData = JSON.parse(data);

    cycleLength = userData.cycle_length;
    periodLength = userData.period_length;
    lastStart = new Date(userData.last_start);

    if (userData.marked_days) {
        selectedDays = userData.marked_days;
    }
}

render();

</script>

</body>
</html>
