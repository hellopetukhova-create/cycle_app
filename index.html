<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Cycle App</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont;
    background: linear-gradient(#fce4ec, #f8bbd0);
}

/* HEADER */
.header {
    text-align: center;
    padding: 20px;
    font-weight: bold;
    font-size: 20px;
}

/* CALENDAR */
.calendar {
    background: white;
    border-radius: 20px;
    padding: 10px;
    margin: 10px;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: #999;
    font-size: 12px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 10px;
}

.day {
    height: 45px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f5;
}

/* STATES */
.period {
    background: #ff5c8a;
    color: white;
}

.ovulation {
    background: #3b2b8f;
    color: white;
}

.fertile {
    background: #ffd1dc;
}

.today {
    border: 2px solid black;
}

/* BOTTOM CARD */
.card {
    background: white;
    border-radius: 20px;
    padding: 15px;
    margin: 10px;
}

.big {
    font-size: 26px;
    font-weight: bold;
}

.small {
    color: #777;
}
</style>
</head>

<body>

<div class="header" id="month"></div>

<div class="calendar">
    <div class="weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div>
        <div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div id="grid" class="grid"></div>
</div>

<div class="card">
    <div class="big" id="status">День цикла</div>
    <div class="small" id="info">Информация</div>
</div>

<script>
let selectedDays = [];
let current = new Date();

// 👉 ТВОИ ДАННЫЕ (потом подключим к боту)
const cycleLength = 28;
const periodLength = 5;
const lastStart = new Date("2026-03-13");

// расчет овуляции
function getOvulation(start) {
    return new Date(start.getTime() + (cycleLength - 14) * 86400000);
}

// проверка диапазона
function isBetween(date, start, end) {
    return date >= start && date <= end;
}

function render() {
    const grid = document.getElementById("grid");
    const month = document.getElementById("month");

    grid.innerHTML = "";

    const year = current.getFullYear();
    const m = current.getMonth();

    month.innerText = `${year} - ${m + 1}`;

    const firstDay = new Date(year, m, 1).getDay();
    const offset = firstDay === 0 ? 6 : firstDay - 1;
    const daysInMonth = new Date(year, m + 1, 0).getDate();

    const ovulation = getOvulation(lastStart);
    const fertileStart = new Date(ovulation.getTime() - 4 * 86400000);
    const fertileEnd = new Date(ovulation.getTime() + 1 * 86400000);

    for (let i = 0; i < offset; i++) {
        grid.appendChild(document.createElement("div"));
    }

    for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, m, d);
        const div = document.createElement("div");
        div.classList.add("day");
        div.innerText = d;

        // today
        if (date.toDateString() === new Date().toDateString()) {
            div.classList.add("today");
        }

        // менструация
        const periodEnd = new Date(lastStart.getTime() + periodLength * 86400000);
        if (isBetween(date, lastStart, periodEnd)) {
            div.classList.add("period");
        }

        // овуляция
        if (date.toDateString() === ovulation.toDateString()) {
            div.classList.add("ovulation");
        }

        // фертильные дни
        if (isBetween(date, fertileStart, fertileEnd)) {
            div.classList.add("fertile");
        }

        div.onclick = () => {
    const iso = date.toISOString().split("T")[0];

    if (selectedDays.includes(iso)) {
        selectedDays = selectedDays.filter(d => d !== iso);
        div.classList.remove("period");
    } else {
        selectedDays.push(iso);
        div.classList.add("period");
    }

    showInfo(date);
};

        grid.appendChild(div);
    }
}

function showInfo(date) {
    const status = document.getElementById("status");
    const info = document.getElementById("info");

    const diff = Math.floor((date - lastStart) / 86400000) + 1;

    status.innerText = `День цикла ${diff}`;

    if (diff < 0) {
        info.innerText = "До начала цикла";
    } else if (diff <= periodLength) {
        info.innerText = "Менструация 🩸";
    } else if (diff === cycleLength - 14) {
        info.innerText = "Овуляция 💜";
    } else {
        info.innerText = "Обычный день";
    }
function saveData() {
    const tg = window.Telegram.WebApp;

    tg.sendData(JSON.stringify({
        type: "save_cycle",
        days: selectedDays
    }));

    tg.close();
}
}
render();
</script>
<button onclick="saveData()">Сохранить 🌸</button>

</body>
</html>
